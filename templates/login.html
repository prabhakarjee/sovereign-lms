{% extends 'base.html' %}

{% block title %}Log in | Loans Emporium Learning{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card" style="padding: 2.5rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🛡️</div>
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Loans Emporium</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 2rem;">
            Institutional Employee Learning & Compliance Portal
        </p>

        <!-- Direct Authentik SSO Button -->
        <a href="https://portal.loansemporium.com" class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;">
            ⚡ Sign in with Authentik SSO
        </a>

        <div style="position: relative; margin: 1.5rem 0; text-align: center;">
            <hr style="border-color: var(--border-subtle);">
            <span style="position: absolute; top: -10px; background: var(--bg-surface); padding: 0 0.75rem; color: var(--text-faint); font-size: 0.75rem; left: 50%; transform: translateX(-50%);">
                OR LOCAL ADMIN LOGIN
            </span>
        </div>

        <form method="POST" action="/login/" style="text-align: left;">
            {% csrf_token %}
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">
                    Username or Email
                </label>
                <input type="text" name="username" required 
                       style="width: 100%; padding: 0.65rem 0.85rem; background: #0b0f19; border: 1px solid var(--border-subtle); border-radius: 8px; color: #fff; font-size: 0.9rem;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">
                    Password
                </label>
                <input type="password" name="password" required 
                       style="width: 100%; padding: 0.65rem 0.85rem; background: #0b0f19; border: 1px solid var(--border-subtle); border-radius: 8px; color: #fff; font-size: 0.9rem;">
            </div>
            <button type="submit" class="btn btn-secondary" style="width: 100%;">
                Sign in with Credentials
            </button>
        </form>
    </div>
</div>
{% endblock %}
